version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      workflow-actions:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(ci)"
  # Root workflow scanning does not reliably recurse into local composite actions.
  - package-ecosystem: github-actions
    directory: /.github/actions/build-desktop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      desktop-actions:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(ci)"
  # The SPM contract is a local public workspace crate, not a private Git dependency.
  # Cargo/Windows binding upgrades remain deliberate paired changes; no auto-merge.
