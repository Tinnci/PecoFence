name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-desktop
        with:
          private-dependency-token: ${{ secrets.PRIVATE_REPO_TOKEN || github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: pecofence-portable
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            dist/pecofence-*-x64.zip
            dist/pecofence-*-x64.zip.sha256
