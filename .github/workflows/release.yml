name: Draft release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check release version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw "Tag must match Cargo.toml version" }
      - uses: ./.github/actions/build-desktop
        with:
          private-dependency-token: ${{ secrets.PRIVATE_REPO_TOKEN || github.token }}
      - name: Create draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem dist/pecofence-*-x64.zip,dist/pecofence-*-x64.zip.sha256 | ForEach-Object FullName)
          gh release create $env:GITHUB_REF_NAME @assets --draft --verify-tag --generate-notes --title "PecoFence $env:GITHUB_REF_NAME"
