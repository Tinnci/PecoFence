# Modified from the pinned upstream manifest: standalone package metadata and
# public dependency declarations replace private workspace inheritance.
[package]
name = "spm-contracts"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["SPM Engineering"]
description = "Runtime-independent SPM v2 wire contracts"

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
thiserror = "2.0"
