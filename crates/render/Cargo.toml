[package]
name = "pecofence-render"
version.workspace = true
edition.workspace = true
license.workspace = true
autoexamples = false

[dependencies]
pecofence-plugin-api = { path = "../plugin-api" }
# Test-only rasterizer (feature `raster`); never part of the app build.
tiny-skia = { version = "=0.11.4", default-features = false, features = ["std", "simd", "png-format"], optional = true }

[features]
raster = ["dep:tiny-skia"]

[target.'cfg(windows)'.dependencies]
pecofence-core = { path = "../core" }
windows-core = { workspace = true }
windows-numerics = { workspace = true }
windows-canvas = { workspace = true }
windows-composition = { workspace = true }
windows-collections = "0.100"
windows-time = "0.100"
bezier_easing = "0.3"
pecofence-platform = { path = "../platform" }
tracing = { workspace = true }

[[example]]
name = "fence_material_preview"
path = "examples/fence_material_preview.rs"

[[example]]
name = "canvas_redraw_bench"
path = "examples/canvas_redraw_bench.rs"

[lints]
workspace = true
