[package]
name = "pecofence-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command line for PecoFence: read-only workspace queries, organizing suggestions, and the app's status and graceful quit"

[[bin]]
name = "pecofence-cli"
path = "src/main.rs"

[dependencies]
pecofence-core = { path = "../core" }
pecofence-shell-contract = { path = "../shell-contract" }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
