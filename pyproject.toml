[project]
name = "pecofence-dev-tools"
version = "0.1.0"
description = "Development and verification tools for the native Rust PecoFence application"
requires-python = ">=3.14"
classifiers = ["Private :: Do Not Upload"]

[dependency-groups]
dev = ["ruff>=0.17,<0.18"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["vendor", "third_party", "docs/history", "docs/_ref"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
