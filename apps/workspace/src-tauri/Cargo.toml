[package]
name = "tinnci-workspace"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"

# Independently packaged; the organizer's default build stays native-only.
[workspace]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12", features = ["serde-compat"] }
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "rt", "macros"] }

[target.'cfg(windows)'.dependencies]
tauri = { version = "2.11.6", features = [] }
tauri-plugin-single-instance = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
